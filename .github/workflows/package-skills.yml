name: Package Skills

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release 版本号'
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and package all skills
        id: package
        run: |
          ROOT=$(pwd)
          mkdir -p "$ROOT/packaged"

          # Find all skill directories (containing SKILL.md)
          for dir in */; do
            skill_name="${dir%/}"
            if [ -f "$dir/SKILL.md" ]; then
              echo "Packaging skill: $skill_name"
              (cd "$skill_name" && zip -r "$ROOT/packaged/${skill_name}.zip" .)
            fi
          done

          # Create all-in-one zip
          echo "Creating all-in-one package..."
          (cd "$ROOT/packaged" && zip -r "all-skills.zip" *.zip)

          echo "Packaged files:"
          ls -lh "$ROOT/packaged/"

      - name: Upload to Volcengine TOS
        env:
          TOS_ACCESS_KEY: ${{ secrets.VOLC_ACCESSKEY }}
          TOS_SECRET_KEY: ${{ secrets.VOLC_SECRETKEY }}
        run: |
          pip install tos

          export RELEASE="${{ inputs.release }}"

          python3 << 'EOF'
          import os
          import tos

          ak = os.environ["TOS_ACCESS_KEY"]
          sk = os.environ["TOS_SECRET_KEY"]
          release = os.environ["RELEASE"]

          endpoint = "tos-cn-beijing.volces.com"
          region = "cn-beijing"
          bucket_name = "runify"

          client = tos.TosClientV2(ak, sk, endpoint, region)

          packaged_dir = "packaged"
          for filename in os.listdir(packaged_dir):
              if filename.endswith(".zip"):
                  local_path = os.path.join(packaged_dir, filename)
                  key = f"skills/{release}/{filename}"
                  print(f"Uploading {filename} -> {key}")
                  client.put_object_from_file(bucket_name, key, local_path)

          print(f"All files uploaded to s3://runify/skills/{release}/")
          EOF
