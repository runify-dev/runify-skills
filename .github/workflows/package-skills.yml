name: Package Skills

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and package all skills
        id: package
        run: |
          ROOT=$(pwd)
          mkdir -p "$ROOT/packaged"

          # Find all skill directories (containing SKILL.md and meta.json)
          for dir in */; do
            skill_name="${dir%/}"
            if [ -f "$dir/SKILL.md" ] && [ -f "$dir/meta.json" ]; then
              # Read version from meta.json
              version=$(python3 -c "import json; print(json.load(open('$dir/meta.json'))['version'])")
              echo "Packaging skill: $skill_name v$version"

              # Create version directory
              mkdir -p "$ROOT/packaged/$skill_name/$version"

              # Zip skill files, excluding icon and meta.json
              (cd "$skill_name" && zip -r "$ROOT/packaged/$skill_name/$version/index.zip" . -x "icon" -x "meta.json")

              # Copy icon to version directory (alongside zip)
              if [ -f "$dir/icon" ]; then
                cp "$dir/icon" "$ROOT/packaged/$skill_name/$version/icon"
              fi

              # Copy meta.json to packaged dir for upload
              cp "$dir/meta.json" "$ROOT/packaged/$skill_name/meta.json"

              # Get zip size
              zip_size=$(stat -f%z "$ROOT/packaged/$skill_name/$version/index.zip" 2>/dev/null || stat -c%s "$ROOT/packaged/$skill_name/$version/index.zip")
              echo "  -> $skill_name/$version/index.zip ($zip_size bytes)"
            fi
          done

          echo "Packaged files:"
          find "$ROOT/packaged" -type f | sort

      - name: Generate metadata and upload to TOS
        env:
          TOS_ACCESS_KEY: ${{ secrets.VOLC_ACCESSKEY }}
          TOS_SECRET_KEY: ${{ secrets.VOLC_SECRETKEY }}
        run: |
          pip install tos

          python3 << 'PYEOF'
          import os
          import json
          from datetime import datetime, timezone

          ak = os.environ["TOS_ACCESS_KEY"]
          sk = os.environ["TOS_SECRET_KEY"]
          endpoint = "tos-cn-beijing.volces.com"
          region = "cn-beijing"
          bucket_name = "runify"

          import tos
          client = tos.TosClientV2(ak, sk, endpoint, region)

          packaged_dir = "packaged"
          skills_list = []

          # Walk through packaged skill directories
          for skill_name in sorted(os.listdir(packaged_dir)):
              skill_dir = os.path.join(packaged_dir, skill_name)
              if not os.path.isdir(skill_dir):
                  continue

              # Read meta.json
              meta_path = os.path.join(skill_dir, "meta.json")
              if not os.path.isfile(meta_path):
                  continue

              with open(meta_path, "r", encoding="utf-8") as f:
                  meta = json.load(f)

              version = meta.get("version", "")
              if not version:
                  print(f"  Skip {skill_name}: no version in meta.json")
                  continue

              version_dir = os.path.join(skill_dir, version)

              # Upload icon if exists (in version directory)
              icon_path = os.path.join(version_dir, "icon")
              if os.path.isfile(icon_path):
                  icon_key = f"skills/{skill_name}/{version}/icon"
                  print(f"  Upload {icon_key}")
                  client.put_object_from_file(bucket_name, icon_key, icon_path, headers={"x-tos-acl": "public-read"})

              # Upload zip
              zip_file = os.path.join(version_dir, "index.zip")
              if not os.path.isfile(zip_file):
                  continue

              zip_size = os.path.getsize(zip_file)
              zip_key = f"skills/{skill_name}/{version}/index.zip"
              print(f"  Upload {zip_key}")
              client.put_object_from_file(bucket_name, zip_key, zip_file, headers={"x-tos-acl": "public-read"})

              skills_list.append(skill_name)

              # Build version index.json
              version_index = {
                  "version": version,
                  "time": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "size": zip_size,
                  "file": "index.zip"
              }
              version_json_path = os.path.join(version_dir, "index.json")
              with open(version_json_path, "w", encoding="utf-8") as f:
                  json.dump(version_index, f, indent=2, ensure_ascii=False)

              v_key = f"skills/{skill_name}/{version}/index.json"
              print(f"  Upload {v_key}")
              client.put_object_from_file(bucket_name, v_key, version_json_path, headers={"x-tos-acl": "public-read"})

              # Build skill index.json
              skill_index = {
                  "id": skill_name,
                  "name": meta.get("name", ""),
                  "vendor": meta.get("vendor", skill_name),
                  "icon": f"skills/{skill_name}/{version}/icon",
                  "tags": meta.get("tags", []),
                  "summary": meta.get("summary", ""),
                  "capabilities": meta.get("capabilities", []),
                  "requires": meta.get("requires", []),
                  "note": meta.get("note", ""),
                  "source": f"https://github.com/runify-dev/runify-skills/tree/main/{skill_name}",
                  "versions": [
                      {
                          "version": version,
                          "time": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                      }
                  ]
              }

              # Check if existing index.json in OSS to merge versions
              existing_key = f"skills/{skill_name}/index.json"
              try:
                  resp = client.get_object(bucket_name, existing_key)
                  existing_data = json.loads(resp.read().decode("utf-8"))
                  existing_versions = existing_data.get("versions", [])
                  version_nums = [v["version"] for v in existing_versions]
                  if version not in version_nums:
                      skill_index["versions"] = skill_index["versions"] + existing_versions
                  else:
                      skill_index["versions"] = existing_versions
              except Exception:
                  pass

              skill_json_path = os.path.join(skill_dir, "index.json")
              with open(skill_json_path, "w", encoding="utf-8") as f:
                  json.dump(skill_index, f, indent=2, ensure_ascii=False)

              print(f"  Upload {existing_key}")
              client.put_object_from_file(bucket_name, existing_key, skill_json_path, headers={"x-tos-acl": "public-read"})

          # Root index.json
          root_index = {"skills": skills_list}
          root_index_path = os.path.join(packaged_dir, "index.json")
          with open(root_index_path, "w", encoding="utf-8") as f:
              json.dump(root_index, f, indent=2, ensure_ascii=False)

          print(f"\nUpload skills/index.json")
          client.put_object_from_file(bucket_name, "skills/index.json", root_index_path, headers={"x-tos-acl": "public-read"})

          print("\nDone!")
          print(f"  skills/index.json -> {root_index}")
          PYEOF
