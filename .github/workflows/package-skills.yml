name: Package Skills

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release 版本号'
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and package all skills
        id: package
        run: |
          ROOT=$(pwd)
          mkdir -p "$ROOT/packaged"

          # Find all skill directories (containing SKILL.md)
          for dir in */; do
            skill_name="${dir%/}"
            if [ -f "$dir/SKILL.md" ]; then
              echo "Packaging skill: $skill_name"
              (cd "$skill_name" && zip -r "$ROOT/packaged/${skill_name}.zip" .)
            fi
          done

          # Create all-in-one zip
          echo "Creating all-in-one package..."
          (cd "$ROOT/packaged" && zip -r "all-skills.zip" *.zip)

          echo "Packaged files:"
          ls -lh "$ROOT/packaged/"

      - name: Upload to Volcengine OSS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.VOLC_ACCESSKEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.VOLC_SECRETKEY }}
        run: |
          pip install awscli

          RELEASE="${{ inputs.release }}"

          for file in packaged/*.zip; do
            filename=$(basename "$file")
            echo "Uploading $filename -> skills/$RELEASE/$filename"
            aws s3 cp "$file" "s3://runify/skills/$RELEASE/$filename" \
              --endpoint-url https://runify.cn-beijing.volces.com
          done

          echo "All files uploaded to s3://runify/skills/$RELEASE/"
